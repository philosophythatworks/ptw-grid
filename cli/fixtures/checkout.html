<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>여름 반팔 티셔츠 | 예시몰</title>
<style>
  body { margin: 0; font-family: sans-serif; color: #222; }
  header { position: sticky; top: 0; background: #fff; display: flex; justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid #ddd; z-index: 5; }
  header .logo { font-weight: bold; font-size: 22px; color: #0a7; text-decoration: none; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 24px; }
  .ph { height: 420px; background: #f3f3f3; }
  .row { margin: 14px 0; }
  .qty { display: flex; gap: 6px; align-items: center; }
  .qty input { width: 48px; text-align: center; }
  /* 함정: 단추 순서가 뒤집혀 보임 (글 순서: 바로 구매 → 장바구니 담기, 화면: 장바구니 담기 | 바로 구매) */
  .buy { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 12px; margin-top: 24px; }
  .buy button { padding: 12px 24px; font-size: 16px; }
  .detail { grid-column: 1 / span 2; }
  .detail p { line-height: 1.8; }
  /* 쿠키 안내가 아래에 붙어서 구매 단추를 가림 */
  .cookie { position: fixed; left: 0; right: 0; bottom: 0; height: 380px; background: #222; color: #fff; padding: 24px; box-sizing: border-box; }
</style>
</head>
<body>
<header>
  <a class="logo" href="/">예시몰</a>
  <a href="/cart">장바구니 (0)</a>
</header>
<main>
  <div class="ph" role="img" aria-label="빨간 반팔 티셔츠 사진"></div>
  <form onsubmit="return false">
    <h1>여름 반팔 티셔츠</h1>
    <p><s>25,000원</s> 19,900원</p>
    <p>무료 배송 · 오늘 주문하면 내일 도착</p>
    <p>카드 결제 시 최대 10% 추가 할인 · <a href="/review">리뷰 4.8 (1,203)</a></p>
    <div class="row">
      <label for="color">색상</label>
      <select id="color" required>
        <option value="">선택하세요</option>
        <option>빨강</option>
        <option>파랑</option>
        <option>검정</option>
      </select>
    </div>
    <fieldset class="row">
      <legend>사이즈</legend>
      <label><input type="radio" name="size" value="S" required> S</label>
      <label><input type="radio" name="size" value="M"> M</label>
      <label><input type="radio" name="size" value="L"> L</label>
    </fieldset>
    <div class="row qty">
      <span>수량</span>
      <button type="button" aria-label="수량 빼기" disabled>−</button>
      <input type="number" aria-label="수량" value="1" min="1" max="10">
      <button type="button" aria-label="수량 더하기">+</button>
    </div>
    <p style="color:#888">색상과 사이즈를 고르면 장바구니에 담을 수 있어요. <a href="/size-guide">사이즈 가이드</a></p>
    <div class="buy">
      <button type="button">바로 구매</button>
      <button type="button" disabled>장바구니 담기</button>
    </div>
  </form>
  <section class="detail" aria-label="상품 설명">
    <h2>상품 설명</h2>
    <p>가볍고 시원한 면 100% 반팔 티셔츠예요. 여름 내내 편하게 입을 수 있어요.</p>
    <p>세탁은 찬물에 뒤집어서 해 주세요. 건조기는 줄어들 수 있어요.</p>
  </section>
</main>
<div class="cookie" role="region" aria-label="쿠키 안내">
  <p>이 사이트는 더 나은 서비스를 위해 쿠키를 사용합니다.</p>
  <button type="button">확인</button>
</div>
</body>
</html>
