<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>제철 과일 | 예시몰</title>
<style>
  body { margin: 0; font-family: sans-serif; color: #222; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 24px; border-bottom: 1px solid #ddd; }
  header .logo { font-weight: bold; font-size: 22px; color: #0a7; text-decoration: none; }
  header input { flex: 1; padding: 8px; }
  header nav { display: flex; gap: 12px; }
  /* 함정 1: 필터 기둥이 글 순서로는 먼저지만 화면에서는 오른쪽 */
  .layout { display: grid; grid-template-columns: 1fr 240px; grid-template-areas: "list filter"; gap: 24px; padding: 24px; }
  .filter { grid-area: filter; border: 1px solid #ddd; padding: 12px; }
  .list { grid-area: list; }
  /* 함정 2: 상품이 세로로 먼저 채워짐 (글 순서: 1열 위→아래, 2열 위→아래 …) */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, auto); grid-auto-flow: column; gap: 16px; }
  .card { border: 1px solid #eee; padding: 8px 12px; }
  .card .ph { height: 64px; background: #f3f3f3; margin-bottom: 8px; }
  .card h3 { margin: 4px 0; font-size: 16px; }
  .card p { margin: 4px 0; }
  footer { padding: 24px; border-top: 1px solid #ddd; color: #666; }
</style>
</head>
<body>
<header>
  <a class="logo" href="/">예시몰</a>
  <input type="search" aria-label="상품 검색" placeholder="상품 검색">
  <nav aria-label="내 메뉴"><a href="/login">로그인</a><a href="/cart">장바구니</a></nav>
</header>
<div class="layout">
  <aside class="filter" aria-label="필터">
    <h2>필터</h2>
    <h3>가격대</h3>
    <label><input type="checkbox"> 1만 원 이하</label><br>
    <label><input type="checkbox"> 1만~3만 원</label><br>
    <label><input type="checkbox"> 3만 원 이상</label>
    <h3>원산지</h3>
    <label><input type="checkbox"> 국내산</label><br>
    <label><input type="checkbox"> 수입</label>
    <p><button type="button">필터 적용</button></p>
  </aside>
  <main class="list">
    <h1>제철 과일</h1>
    <div class="grid">
      <div class="card"><div class="ph"></div><h3>사과 1kg</h3><p>12,900원</p><button type="button">담기</button></div>
      <div class="card"><div class="ph"></div><h3>배 2kg</h3><p>18,500원</p><button type="button">담기</button></div>
      <div class="card"><div class="ph"></div><h3>귤 3kg</h3><p>15,800원</p><button type="button">담기</button></div>
      <div class="card"><div class="ph"></div><h3>포도 1.5kg</h3><p>21,000원</p><button type="button">담기</button></div>
      <div class="card"><div class="ph"></div><h3>딸기 500g</h3><p>9,900원</p><button type="button">담기</button></div>
      <div class="card"><div class="ph"></div><h3>수박 1통</h3><p>24,900원</p><button type="button">담기</button></div>
      <div class="card"><div class="ph"></div><h3>참외 2kg</h3><p>16,400원</p><button type="button">담기</button></div>
      <div class="card"><div class="ph"></div><h3>복숭아 1.5kg</h3><p>27,500원</p><button type="button">담기</button></div>
      <div class="card"><div class="ph"></div><h3>자두 1kg</h3><p>11,200원</p><button type="button">담기</button></div>
      <div class="card"><div class="ph"></div><h3>망고 4개</h3><p>19,900원</p><button type="button">담기</button></div>
      <div class="card"><div class="ph"></div><h3>키위 1kg</h3><p>8,700원</p><button type="button">담기</button></div>
      <div class="card"><div class="ph"></div><h3>블루베리 300g</h3><p>13,300원</p><button type="button">담기</button></div>
    </div>
  </main>
</div>
<footer>예시몰 · 고객센터 1588-0000</footer>
</body>
</html>
